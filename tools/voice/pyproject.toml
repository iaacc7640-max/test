[project]
name = "aggobai-voice"
version = "0.1.0"
description = "Turns Marathi AI speech (Meta MMS-TTS) into a sung vocal track for the music video"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.3",
    "transformers>=4.40",
    "pyworld>=0.3.4",
    "numpy<2.3",
    "scipy>=1.11",
    "soundfile>=0.12",
    "setuptools<81",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
